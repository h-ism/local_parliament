# 兵庫県議会 — 本会議会議録
#
# `kensakusystem.jp`, the same product as 愛媛・三重 — and the one that shows how
# little "the same product" guarantees. Two things differ, and each of them makes
# the 愛媛 config collect nothing at all:
#
# 1. **The tree is newer markup.** Nodes are `<A HREF="#" class="js-tree-submit"
#    data-depth="令和 7年  2月第370回定例会 ">`, not the `onClick=…treedepth.value`
#    of the other two. The scraper now reads both.
# 2. **There is no ダウンロード button.** The speaker index carries no
#    `downloadPos` checkboxes, so `GetPerson.exe` has nothing to assemble. What
#    it has instead is 全文表示 — `GetText3.exe?…&FUNC=PRINT_ALL` — which returns
#    the whole sitting as HTML in **one** request. See `download` below.
#
# No robots.txt on the host (404); pages are marked `follow,index`. cp932.
#
# Coverage: 本会議 **昭和61年 (1986)** 〜 — the deepest archive in the survey.
# 予算特別委員会・決算特別委員会 reach back equally far and 常任委員会 to 平成17年6月;
# all three are in the same tree and all three are collected now.

prefecture = "兵庫県"
name = "hyogo"
scraper = "kensakusystem"

[kensakusystem]
base_url = "https://www.kensakusystem.jp/hyogopref/"
download = "printall"

# Every node under a year, which on this tenant is not a preference but a
# correction. `定例会|臨時会` skipped 「昭和61年 第198回定 」 — a label truncated
# mid-word in the site's own tree — and with it the sitting of 1986-06-05, which
# was missing from the corpus for a week with nothing to show for it. A node that
# is never opened cannot warn.
#
# It also opens the committees: 常任委員会 from 平成17年, 予算特別委員会 and
# 決算特別委員会 from 昭和61年 — as deep as the 本会議 archive — and the 協議会・
# 検討会・世話人会 the assembly also records.
sessions = '.'

# The whole archive, 昭和61年 onwards. As on 三重, the corpus window is excluded
# per run with --since/--until, which prunes before anything is fetched.
years = []

# 「○議長（浜田知昭）　　ただいまから本日の会議を開きます。」
# 「○（北野　実議員）　　おはようございます。自由民主党議員団、…」
#
# Both forms appear in the same sitting: office-holders as 役職（氏名）, members as
# （氏名＋議員） with the役職 slot empty. The same rule takes both, and 昭和61年
# reads identically apart from the 「君」 honorific, which `_clean_speaker` strips.
#
# What follows the closing bracket is what separates 「○議事日程（第３号）」 — a heading with the
# exact shape of a marker — from a speech. Counted on 6 sample sittings across
# 昭和61年 and 令和7年: every real speech taken, only the 議事日程 line left.
#
# The `(?:議員)?` drops the office that modern 兵庫 appends inside the brackets, so
# a member is stored as 「北野　実」 rather than 「北野　実議員」 — the same name the
# 議長 would use for them, and the same shape 昭和61年 already has (where the
# honorific is 「君」 and `_clean_speaker` takes it). Verified to change nothing
# else: the same 190 and 70 speeches are found with and without it.
#
# 委員会 forced this rule apart from the one that collected 本会議, and each of the
# three branches added below was a document that parsed to **zero speeches**:
#
#   本会議        「○議長（浜田知昭）　　ただいまから本日の会議を開きます。」
#   兵庫 委員会   「○委員長（門間雄司）」 — the speech begins on the *next* line
#   兵庫 委員会   「○（庄本えつこ委員）」 — likewise, and no office outside the brackets
#   三重 委員会   「○小島委員長　　ただいまの報告に対し、…」 — no brackets at all
#
# So: branch 1 is the 本会議 rule unchanged; branch 2 takes a marker left alone on
# its line with the office outside the brackets; branch 3 the same with the office
# inside; branch 4 the unbracketed 三重 form. A regex cannot name a group twice, so
# the branches number theirs and `split_speeches` reads whichever matched.
#
# What each branch had to be guarded against, all of it seen in the sample:
#
# * 「○議事日程（第７号）」 is a heading with branch 2's exact shape, and it also ends
#   its line. Branch 2 therefore refuses digits *inside* the brackets: a sitting has
#   no speaker called 第７号, and where a number does belong to a person it is the
#   office — 「○39番（岩名秀樹君）」 — which sits outside them.
# * 「○（議事日程）」, 「○（会議の概要）」, 「○（１　諸　報　告）」, 「○（部外局関係）」 are
#   headings with branch 3's exact shape. Branch 3 therefore requires the office
#   suffix 委員・委員長・議長… , which is 和歌山's 「君」 trick again: the roster and
#   the headings have no honorific and the speakers all do.
# * 「○（内藤兵衛委員長発言の概要）」 is a real marker: 兵庫 records some of what a
#   chair said as a summary rather than verbatim. 「発言の概要」 stays inside the
#   office so the corpus says which it is, rather than being trimmed away.
# * 「○議事日程　　」 is a heading with branch 4's shape. Branch 4 requires text to
#   follow on the same line, which a heading never has.
#
# Counted on 19 sample sittings across the three tenants and both marker
# generations, then re-parsed over all 2,294 collected 本会議 sittings from cache:
# 三重 47,279 and 愛媛 39,624 unchanged to the speech, 兵庫 **+8** — eight markers
# whose text began on the next line, which the 本会議 rule had been dropping since
# it was written. Nothing was lost anywhere.
#
# **The main brackets are full-width, and the office may contain half-width ones.**
# That correction was worth 55 speeches and 124 broken speaker names. 兵庫 writes
# 「○まちづくり部参事(園芸・公園担当)兼公園緑地課長（北村智顕）」, and a role class that
# stopped at *any* opening bracket cut the office at 「参事」 and then let the name
# group swallow 「園芸・公園担当)兼公園緑地課長（北村智顕」 whole — a speaker made of an
# office, which nothing warns about. Requiring 「（」 for the marker's own brackets
# separates the two: verified over the three corpora that **no marker anywhere uses
# a half-width bracket as its own**, while offices routinely do.
#
# **And the office runs past 24 characters.** 「○高校教育課学校支援推進官兼義務教育課
# 学校支援推進官（辻　登志雄）」 is 26, so the old bound matched *nothing* on that line
# and the speech was swallowed into the previous speaker's text — 9 of them in one
# 文教常任委員会 alone. 60 now, which is what the longest real office needs.
#
# Re-parsed over all 10,006 collected sittings from cache: 兵庫 **+47**, 三重 **+8**,
# 愛媛 unchanged, and nothing lost anywhere.
#
# **A number is not a speaker, and excluding numbers loses speakers.** Two false
# positives survived everything above: 「○３　閉会中の継続調査事件」 is a numbered
# heading with branch 4's shape, and 「○伊藤副委員長　　（１）（２）（３）とあるんですが」
# is a speech whose *text* opens with a bracketed number, which branch 1 read as
# the name. The obvious fix — no digits in a speaker — costs **33 real speeches**:
# 兵庫 writes 「○（陰山　地域整備第１局長）」, name and office inside one pair of
# brackets, and offices are numbered. So the guard is narrower than that: a
# speaker may not be *only* digits (branch 1 must end on something else) and may
# not *begin* with one (branch 4). Measured over all 10,006 sittings: -1 speech,
# which is the heading.
#
# Laid out with `(?x)`, which ignores the layout but not the spaces inside a
# character class — those are the ones that matter here.
speech_split = '''(?xm)
  ^○ (?:
      (?P<role>[^（\n]{0,60}?) （ (?P<speaker>[^）\n]{0,39}?[^）\n0-9０-９]) (?:議員)? ） (?=[ 　（(])
    | (?P<role2>[^（\n]{1,60}?) （ (?P<speaker2>[^）\n0-9０-９]{1,40}?) ） $
    | （ (?P<speaker3>[^）\n]{1,40}?)
          (?P<role3>(?:議員|委員長|副委員長|委員|議長|副議長) (?:発言の概要)?) ） $
    | (?P<speaker4>[^（(\n0-9０-９][^（(\n]{0,19}?) (?=[ 　]+\S)
  )'''
