# 北海道議会 — 本会議（定例会・臨時会）, gijiroku VOICES
#
# Written 2026-11-01 from the reconnaissance cache of 2026-10-31 (150 pages,
# 20:05–20:10, inside the confirmed night), offline. Same product and route as
# 滋賀・石川・栃木 (`scrapers/voices.py`); LOG.md records what the cached
# sittings showed and what they could not.
#
# 本会議 only, as the others.

prefecture = "北海道"
name = "hokkaido"
scraper = "voices"

[voices]
index_url = "https://pref-hokkaido.gijiroku.com/voices/g08v_viewh.asp"

# robots.txt disallows /voices/cgi/ — the vendor's file, the same on every VOICES
# install. The assembly answered our letter about collecting these minutes.
[robots]
exempt = ["https://pref-hokkaido.gijiroku.com/voices/"]
reason = "北海道議会事務局: 運営者本人の回答による許可（2026-09-30）。robots.txt の Disallow はベンダー標準で、回答が優先する。docs/hokkaido.md"
decided_on = "2026-09-30"

# The 9/30 period (10/3〜11/24, 土日祝, 20:00–06:00) narrowed to the two nights
# the vendor confirmed on 10/30. Since 10/23 dates are arranged one request at a
# time, so the next weekend is a new answer and moves first_day / last_day.
[fetch_window]
days = ["sat", "sun"]
holidays = ["2026-10-12", "2026-11-03", "2026-11-23"]
first_day = "2026-10-31"
last_day = "2026-11-01"
start = "20:00"
end = "06:00"
reason = "北海道議会事務局 (2026-09-30): 10月3日（土）〜11月24日（火）の土日祝の夜間帯（20時～6時）／2026-10-30 ベンダー経由で確定: 10/31（土）20時～11/1 6時、11/1（日）20時～11/2 6時は実施して問題なし。1件2秒以上・同時アクセス禁止・ローカル保存・期間と時間帯の遵守を再確認。負荷がかかれば停止を求めることがある"
decided_on = "2026-10-30"

# The enquiry 北海道 answered was 共同研究者B's; that is the address they have.
[contact]
ref = "collaborator_b"  # the address is in contacts.toml, not in git
note = "照会は共同研究者Bが行った — 北海道"

# They asked to be told before we run, and for a contact in case of trouble.
# Sent 2026-09-30 for the whole period; the 10/30 confirmation answered it.
[notice]
who = "北海道議会事務局"
last_sent = "2026-09-30"
covers_until = "2026-11-24"
what = "10/3〜11/24 の土日祝（10/12・11/3・11/23）20時〜翌6時。初回は下見、以降は会議録本文。1件2秒以上・直列。連絡先は collaborator_b。10/30 にベンダー経由で 10/31・11/1 の夜を確定"
