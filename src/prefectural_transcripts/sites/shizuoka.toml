[list]
meeting_link = 'a[href*="OpenDocument"]'

# Six navigation links, no text, no `alt`, and image ids that change between
# renders — only the href tells 「次へ」 from 「先頭へ」. `select_one` takes the first,
# which is 「先頭へ」, and the crawl then walks one page and stops without a sound.
next_page = 'a[href*="ExpandView"]'
max_pages = 40

# Every 議会 opens with a 【目次】 document: a table of contents with no speeches
# and no 質問日, which would otherwise land in the corpus as an empty meeting.
exclude = '目次'

[detail]
container = "div#notes"

# 「○知事（鈴木康友君）　…」 — office in the first group, name in the second.
# Members appear as their seat number (「○六番（赤堀慎吾君）」), which is what the
# minutes print, so that is what lands in `role`.
#
# The name must end in 「君」. The attendance roster that opens a 議会補足文書 is
# 「○出　席　議　員（六十七名）」 — structurally identical to a speech marker, and
# without this it lands in the corpus as a speech by 「六十七名」. Over a 40-document
# sample, 632 markers matched and the only four lacking 「君」 were rosters.
#
# **The 「○」 is not always there.** Two documents in 817 write the marker with no
# circle at all — 「健康福祉部長（八木敏裕君）　第四次静岡県がん対策…」 as the whole of a
# 答弁文書, and 「議長（中沢公彦君）　会期についてお諮りします。」 inside a sitting that
# parsed three other speeches perfectly well. The first warned (zero speeches);
# **the second was silent**, which is the failure this repository keeps meeting.
#
# So the rule has two branches and the second is line-anchored: without the circle
# there is no anchor but the start of a line, and 「知事（鈴木康友君）に伺います」 occurs
# mid-sentence in question text. Branch one is the original rule (plus 〇 U+3007,
# which 和歌山 uses for the same marker), so nothing that matched before can stop
# matching — checked by re-parsing all 817 cached documents: **+2 speeches, 0 lost.**
#
# **The marker is not always on one line.** Before about 2004 the Domino markup
# puts each piece in its own cell, so the text comes out as four lines:
#
#     ○議長 / ( / 水口俊太郎君 / ) / 異議なしと認めます｡
#
# 97 markers arrive that way. Whitespace is therefore allowed on both sides of
# both brackets — and only there. It is deliberately *not* allowed inside the name
# group: 「(望月\n暹\n君)」 splits a name across lines too, and matching it would
# put a newline inside a speaker and invent a second 望月　暹. Those 11 are left
# uncollected on purpose; see LOG.md.
#
# Two more shapes the older years use, both real speeches:
#   ○増井浩二君　一言御挨拶…        a bare name, no brackets at all (和歌山's shape)
#   ○条例制定請求代表者（鈴木　望氏） 氏 and さん, not 君 — outside petitioners
#   ○静岡県理事（池谷　廣君登壇）    「登壇」 printed inside the brackets
#
# The guards that earn their keep are unchanged: 「○出　席　議　員（六十七名）」 is a
# roster and still matches nothing, because 「六十七名」 carries no honorific; and
# 「〇七年版ですが、…」 is 〇 used as the *numeral* zero at the start of a line, which
# the honorific rejects too. Both appear in this archive.
#
# Measured over all 14,030 documents before shipping: 62,656 -> 62,780 speeches.
speech_split = '(?m)[○〇](?P<role>[^（(\n]{1,24})\s*[（(]\s*(?P<speaker>[^）)\n]{1,24}(?:君|氏|さん))(?:\s*登壇)?\s*[）)]|^(?P<role2>[^（(\n\s]{1,24})[（(](?P<speaker2>[^）)\n]{1,24}君)[）)]|^[○〇](?P<speaker3>[^（(\n\s][^（(\n]{0,11}(?:君|氏|さん))　'

[detail.patterns]
# Three document types, three ways of writing the same label, and the third one
# was found only by collecting the whole archive:
#
#   質問文書    「質問日：　02/24/2026」      full-width colon
#   議会補足文書 「発言日：　02/17/2026」      full-width colon
#   答弁文書    「（質問日:\n02/24/2026\n番目）」  **half-width**, and on its own line
#
# 答弁文書 is one document per answering official — 「知事」, 「教育部長」 — and it is
# most of the archive by count. 26 of the first 40 documents came back undated
# because of one character.
# **A fourth way, and this one leaves the label empty.** Four 委員会補足文書 print
# 「発言日：」 with nothing after it and put the real date in the body instead:
# 「１　日時　令和３年８月10日（火）」, in 和暦 rather than Domino's month-first form.
# The first branch still wins wherever the label is filled in, because `re.search`
# takes the leftmost match and 発言日 is printed above 日時.
date = '(?:(?:質問日|発言日)[:：]\s*|日時[\s\u3000]*)((?:\d{1,2}/\d{1,2}/\d{4})|(?:令和|平成)\s*[０-９0-9元]{1,2}年\s*[０-９0-9]{1,2}月\s*[０-９0-9]{1,2}日)'
session = '(?:令和|平成)\s*[０-９0-9元]{1,2}年\s*[０-９0-9]{1,2}月静岡県議会(?:定例会|臨時会)'
