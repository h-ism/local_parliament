# 静岡県議会 — 本会議会議録
#
# A Lotus Domino application (`ggiji.nsf`) on www2.pref.shizuoka.jp, serving
# Shift_JIS HTML over plain GET. One document is one 発言単位: a member's question
# with the answers to it, or a 報告事項 / 委員長報告. Coverage starts at
# 平成11年5月臨時会; 目次 documents exist from 平成19年2月定例会.
#
# There is no robots.txt on this host, but every page of the application carries
# `<meta name="robots" content="none">` (plus noindex,nofollow and noarchive).
# That is an indexing directive rather than an access rule, and it is not what
# `PoliteClient` checks — so read `docs/shizuoka.md` before running this.
#
# The markup is 1990s Domino: no classes, no ids inside the document, fields
# labelled only by the text of the neighbouring table cell. Hence `patterns`
# for the metadata and `speech_split` for the body.

prefecture = "静岡県"
name = "shizuoka"

# `ExpandView` opens every 議会 in the 開催別 view — but the view still paginates,
# and that was misread for a week: with the default `Count` it returns **30 rows**,
# which is one session's documents and nothing else. The 2025 collection worked
# only because it was pointed at five sessions by hand with `--start-url`.
#
# `Count=1000` is the whole archive in a handful of requests, which is also kinder
# than three hundred small ones. `Start` is not an integer: Domino numbers rows
# hierarchically and the next page begins at `Start=12.25.6`, so the walk has to
# follow the view's own link rather than count.
# **The walk is windowed, because following the view's own navigation is not
# enough.** `Start=<n>` opens the view at the n-th 議会 and `Count=1000` takes a
# thousand rows from there — 8 to 12 sessions' worth of documents. Stepping by 5
# gives every session two chances to be listed, and documents dedupe by URL, so
# the overlap costs nothing.
#
# Following `次へ` alone reached 平成11年5月 here but **dead-ended at 平成26年11月 on
# the committee side of the same application** — the navigation is not a linear
# sequence and a dead end reads exactly like the end of the archive. 31 windows,
# and the last one is pinned to the oldest row rather than to a multiple of 5.
start_urls = [
    "https://www2.pref.shizuoka.jp/all/ggiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=1",
    "https://www2.pref.shizuoka.jp/all/ggiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=6",
    "https://www2.pref.shizuoka.jp/all/ggiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=11",
    "https://www2.pref.shizuoka.jp/all/ggiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=16",
    "https://www2.pref.shizuoka.jp/all/ggiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=21",
    "https://www2.pref.shizuoka.jp/all/ggiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=26",
    "https://www2.pref.shizuoka.jp/all/ggiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=31",
