# 三重県議会 — 本会議会議録
#
# `kensakusystem.jp`, the same product as 愛媛 and 兵庫 and the same `cgi-bin3`,
# but **not** the same config: the marker form differs (see `speech_split`), and
# 愛媛's rule matches exactly zero speeches here.
#
# No robots.txt on the host (404); every page carries
# `<meta name="robots" CONTENT="follow,index">`. Shift_JIS as `charset=x-sjis`,
# which is really cp932.
#
# Coverage: 本会議 平成元年 (1989) 〜. 委員会 令和5年〜 exists in the same tree and is
# left out by `sessions`.

prefecture = "三重県"
name = "mie"
scraper = "kensakusystem"

[kensakusystem]
base_url = "https://www.kensakusystem.jp/mie/"

# 本会議 only. 「令和 8年 定例会・暫定版 」 matches too — 三重 publishes the current
# session as 暫定版 until the final version replaces it, so a re-run after that
# happens can pick the same sitting up again under a different fileName.
sessions = '定例会|臨時会'

# The whole archive. The corpus window (2011-04 .. 2019-03) is excluded per run
# with --since/--until rather than here: `fileName=R070303A` carries the date, so
# on this site the date filter prunes *before* a transcript is fetched.
years = []

# 「○知事（一見勝之）　令和７年三重県議会定例会の開会に際しまして、…」
#
# 三重 prints office and name separately — 「○議長（稲垣昭義）」, 「○39番（岩名秀樹君）」
# — which is 静岡's shape, not 愛媛's 「○（三宅浩正議長）」. Copying 愛媛's rule here
# yields **0 speeches on every document**: it requires 「○（」 and 三重 never writes
# that. Verified against 平成元年 and 令和7年, both generations.
#
# What follows the closing bracket is load-bearing. 「○議事日程（第１号）」 has the same shape as a
# speech marker and ends the line; requiring a space after the bracket is what
# separates a heading from someone speaking. Counted on 4 sample sittings: it
# takes every real speech and leaves exactly the 議事日程 line.
speech_split = '(?m)^○(?P<role>[^（(\n]{0,24})[（(](?P<speaker>[^）\n]{1,40}?)(?:議員)?[）)](?=[ 　（(])'
