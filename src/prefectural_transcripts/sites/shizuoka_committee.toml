# 静岡県議会 — 委員会会議録
#
# The same Lotus Domino application as `shizuoka.toml` under a different `.nsf`
# (`comgiji.nsf`), the same `WebView1` 開催別 view, the same cp932, and the same
# `<meta name="robots" content="none">` — see `docs/shizuoka.md` for what that tag
# is and the decision recorded against it.
#
# One document is one 発言単位, as on the 本会議 side. Coverage: **平成19年5月 (2007)
# onwards**, 999 committee sittings in the view.
#
# It writes into the same `data/静岡県.jsonl`; `committee` separates the two.

prefecture = "静岡県"
name = "shizuoka_committee"

# `ExpandView` opens every row of the view and `Count=1000` takes a thousand rows
# at a time — a handful of large index pages rather than several hundred small
# ones, which is also the kinder way to ask.
#
# **Windowed, and here it is not optional.** Following the view's own 「次へ」 from
# the first page dead-ends at 平成26年11月 — six years short of the 平成19年5月 the
# collapsed view plainly lists — and a dead end reads exactly like the end of the
# archive. `Start=<n>` opens the view at the n-th sitting instead; a window of
# 1,000 rows covers 46 to 54 of them, so a step of 25 lists everything twice.
# 41 windows over 999 sittings, the last pinned to the oldest row.
start_urls = [
    "https://www2.pref.shizuoka.jp/all/comgiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=1",
    "https://www2.pref.shizuoka.jp/all/comgiji.nsf/WebView1?OpenView&ExpandView&Count=1000&Start=26",
