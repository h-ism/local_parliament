[list]
meeting_link = 'a[href*="OpenDocument"]'

# `Start` is not a number here: Domino positions rows hierarchically and the next
# page begins at something like `Start=12.25.6`, so the walk follows the view's own
# link. The navigation offers three of them — the page before, the current one and
# the page after — with no text, no `alt`, and image ids that change between
# renders, so `_next_page` takes the first one this walk has *not* already been to.
# Taking simply the first walks one page and stops, which looks exactly like
# reaching the end; it silently cost everything before 令和2年9月.
#
# This is redundant with the windows above and kept anyway: two independent
# traversals of the same view, and documents dedupe by URL.
next_page = 'a[href*="ExpandView"]'
max_pages = 40

# 【委員会概要】 is a summary of the sitting, not a speech in it, and its two 「○」
# lines are 「○　第１日目（３月５日）」 — day headings with a marker's shape. It also
# dates itself 開会日 rather than 発言日, so it would land in the corpus undated and
# with two invented speakers.
exclude = '委員会概要|目次'

[detail]
container = "div#notes"

# 「○鈴木（澄）委員」, 「○稲葉スポーツ振興課長」, 「○山田委員長」 — surname and office in
# one run, the parentheses telling two 鈴木 apart rather than separating a name from
# a title, and the speech beginning on the *next* line. Nothing like 本会議's
# 「○知事（鈴木康友君）」: there is no 「君」 here, and a rule requiring one takes
# **zero speeches** from every committee document.
#
# So the marker is the whole line, and the line is the whole marker. Counted on
# sittings from 平成29年 and 令和8年: every 「○」 line is a speaker and no speaker
# line carries anything else — which is why 【委員会概要】 has to be excluded above
# rather than guarded against here.
#
# Name and office are not split. The record runs them together and there is no
# delimiter to split on: 「鈴木（澄）委員」 is how the minutes name that person.
#
# **Both circles.** 静岡 marks most committee speeches with ○ (U+25CB) and some with
# 〇 (U+3007, IDEOGRAPHIC NUMBER ZERO) — 「〇鈴木緊急事態対策課長」 — in the same
# sitting as the other form. The 本会議 side does this too. A missed marker here is
# not an empty document but a *silent* one: the speech is swallowed into whoever
# spoke before it. 6 speeches in the first 66 documents, 0 lost, checked from cache.
speech_split = '(?m)^[○〇](?P<speaker>[^\s][^\n]{0,29})$'

[detail.patterns]
# Domino writes dates month-first; `dates.py` handles that form explicitly.
# 質問文書 and 議会補足文書 write 「発言日：」 with a full-width colon; 答弁文書 writes
# 「（質問日:」 with a half-width one, on its own line. Both, or two thirds of the
# archive arrives undated.
# **A fourth way, and this one leaves the label empty.** Four 委員会補足文書 print
# 「発言日：」 with nothing after it and put the real date in the body instead:
# 「１　日時　令和３年８月10日（火）」, in 和暦 rather than Domino's month-first form.
# The first branch still wins wherever the label is filled in, because `re.search`
# takes the leftmost match and 発言日 is printed above 日時.
date = '(?:(?:質問日|発言日)[:：]\s*|日時[\s\u3000]*)((?:\d{1,2}/\d{1,2}/\d{4})|(?:令和|平成)\s*[０-９0-9元]{1,2}年\s*[０-９0-9]{1,2}月\s*[０-９0-9]{1,2}日)'

# Two generations in the header, and one pattern has to take both:
#
#   令和８年２月定例会文化観光委員会      (the 定例会 is named)
#   平成29年１月スポーツ振興等特別委員会  (it is not)
#
# So 定例会・臨時会 is optional, and the committee is what follows it.
session = '((?:令和|平成)\s*[０-９0-9元]{1,2}年\s*[０-９0-9]{1,2}月(?:定例会|臨時会)?)'
committee = '(?:令和|平成)\s*[０-９0-9元]{1,2}年\s*[０-９0-9]{1,2}月(?:定例会|臨時会)?\s*(.{2,24}?委員会)'
