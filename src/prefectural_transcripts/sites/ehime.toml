# 愛媛県議会 — 本会議会議録
#
# `kensakusystem.jp`, shared with 三重 (`/mie/`) and 兵庫 (`/hyogopref/`); the same
# config shape should carry to both. No robots.txt on the host (404) and every
# page carries `<meta name="robots" CONTENT="follow,index">`.
#
# Driven by `KensakuSystemScraper`, not by selectors — the browse tree navigates
# through an `onClick` attribute with a cp932-encoded label, and a sitting has to
# be assembled from a list of character offsets. See the module docstring in
# `scrapers/kensakusystem.py` and `docs/kensakusystem.md`.
#
# Coverage: 本会議 from 平成3年第229回定例会; 委員会 from 平成19年. Both are collected.

prefecture = "愛媛県"
name = "ehime"
scraper = "kensakusystem"

[kensakusystem]
base_url = "https://www.kensakusystem.jp/ehime/"

# Every node under a year: 本会議 and every 委員会 the tree carries. 愛媛's
# committees reach back to 平成19年 and are written in the same marker form as its
# 本会議, so the rule above takes them unchanged — which was worth checking rather
# than assuming, because neither of the other two tenants is like that.
sessions = '.'

# The whole archive, 平成3年 (1991) onwards.
#
# It was scoped to 平成31年 onwards while only the post-corpus gap was being
# collected. The corpus window (2011-04 .. 2019-03) is now excluded per run with
# --since/--until instead, which costs nothing extra here: `fileName=R070303A`
# carries the date, so the filter prunes before the transcript is fetched. On a
# site whose listing has no dates the knob would have to stay here — that is the
# lesson `--start-url` taught on 和歌山.
years = []

# Two generations, and only one of them looks like the config that collected 2019
# onwards:
#
#   令和7年  「○（三宅浩正議長）　理事者の答弁を求めます。」
#   平成3年  「○47番（岡田己宜君）（拍手）統一地方選挙後初めての定例県議会において…」
#
# The 平成 archive is 三重's shape — office outside the brackets, name inside, and
# the 「君」 honorific `_clean_speaker` strips. A rule requiring 「○（」 takes **0
# lines of every 平成 document**, which would have filled the archive with
# zero-speech warnings rather than transcripts.
#
# The brackets are still load-bearing: the same documents open sections with
# 「○議事日程」 and 「〇出席議員　53名」 — the latter with 〇 (U+3007) rather than
# ○ (U+25CB). What follows the closing bracket separates a heading from a speech:
# a heading ends its line, a speaker is followed by their words — or, in 平成3年,
# by 「（拍手）」, which is why the lookahead accepts an opening bracket as well as
# a space. Counted on 4 sittings from 平成3年 and 令和7年: it takes every speech the
# old rule took, plus the three that open with applause, and leaves 議事日程.
#
# The two bounds are wider than they look and both were paid for. The speaker may
# run to 40 characters because 愛媛 has real ones that do — 「毛利修三愛媛県の未来を
# 創る農業・農村振興条例審査特別委員長」 is 29 — and a 24-character cap dropped two
# such speeches from the whole corpus, silently. It may also contain an ASCII
# bracket, because 「○（大北秀特命担当部長(会計管理者)）」 exists; excluding `)` cut the
# name at the inner bracket and left the speech starting with 「）」.
#
# NOTE: name and office are one run in the modern form (「三宅浩正議長」) and there
# is no lexical rule that splits them, so `role` stays empty there. The 平成
# documents separate them and do populate it. Splitting the modern form properly
# means reading the 出席理事者 roster — see `docs/kensakusystem.md`.
# 委員会 forced this rule apart from the one that collected 本会議, and each of the
# three branches added below was a document that parsed to **zero speeches**:
#
#   本会議        「○議長（浜田知昭）　　ただいまから本日の会議を開きます。」
#   兵庫 委員会   「○委員長（門間雄司）」 — the speech begins on the *next* line
#   兵庫 委員会   「○（庄本えつこ委員）」 — likewise, and no office outside the brackets
#   三重 委員会   「○小島委員長　　ただいまの報告に対し、…」 — no brackets at all
#
# So: branch 1 is the 本会議 rule unchanged; branch 2 takes a marker left alone on
# its line with the office outside the brackets; branch 3 the same with the office
# inside; branch 4 the unbracketed 三重 form. A regex cannot name a group twice, so
# the branches number theirs and `split_speeches` reads whichever matched.
#
# What each branch had to be guarded against, all of it seen in the sample:
#
# * 「○議事日程（第７号）」 is a heading with branch 2's exact shape, and it also ends
#   its line. Branch 2 therefore refuses digits *inside* the brackets: a sitting has
#   no speaker called 第７号, and where a number does belong to a person it is the
#   office — 「○39番（岩名秀樹君）」 — which sits outside them.
# * 「○（議事日程）」, 「○（会議の概要）」, 「○（１　諸　報　告）」, 「○（部外局関係）」 are
#   headings with branch 3's exact shape. Branch 3 therefore requires the office
#   suffix 委員・委員長・議長… , which is 和歌山's 「君」 trick again: the roster and
#   the headings have no honorific and the speakers all do.
# * 「○（内藤兵衛委員長発言の概要）」 is a real marker: 兵庫 records some of what a
#   chair said as a summary rather than verbatim. 「発言の概要」 stays inside the
#   office so the corpus says which it is, rather than being trimmed away.
# * 「○議事日程　　」 is a heading with branch 4's shape. Branch 4 requires text to
#   follow on the same line, which a heading never has.
#
# Counted on 19 sample sittings across the three tenants and both marker
# generations, then re-parsed over all 2,294 collected 本会議 sittings from cache:
# 三重 47,279 and 愛媛 39,624 unchanged to the speech, 兵庫 **+8** — eight markers
# whose text began on the next line, which the 本会議 rule had been dropping since
# it was written. Nothing was lost anywhere.
# Laid out with `(?x)`, which ignores the layout but not the spaces inside a
# character class — those are the ones that matter here.
speech_split = '''(?xm)
  ^○ (?:
      (?P<role>[^（(\n]{0,24}) [（(] (?P<speaker>[^）\n]{1,40}?) (?:議員)? [）)] (?=[ 　（(])
    | (?P<role2>[^（(\n]{1,24}) [（(] (?P<speaker2>[^）\n0-9０-９]{1,40}?) [）)] $
    | [（(] (?P<speaker3>[^）\n]{1,40}?)
          (?P<role3>(?:議員|委員長|副委員長|委員|議長|副議長) (?:発言の概要)?) [）)] $
    | (?P<speaker4>[^（(\n]{1,20}?) (?=[ 　]+\S)
  )'''
